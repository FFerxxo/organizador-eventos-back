name: Revisión

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Sin DATABASE_URL se usa SQLite: las pruebas no tocan Supabase ni usan secretos.
      - run: python manage.py check
      - run: python manage.py test
